  <link href="https://fonts.googleapis.com/css2?family=DM+Sans:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    :root {
      --red:        #c8102e;
      --red-bright: #e01330;
      --bg-dark:    #17181c;
      --card-black: #0d0d10;
      --white:      #ffffff;
      --text-mid:   #d8d8dc;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }
    html, body { height: 100%; overflow: hidden; }

    body {
      font-family: 'DM Sans', sans-serif;
      background: radial-gradient(ellipse at 50% 30%, #3a3b42 0%, #1c1d21 55%, #131316 100%);
      display: flex;
      align-items: center;
      justify-content: center;
    }

    /* ── IFRAME FONDO (precarga la tienda igual que la versión lavanda) ── */
    #mainIframe {
      width: 100%;
      height: 100vh;
      border: none;
      display: block;
      position: fixed;
      inset: 0;
      z-index: 1;
    }

    /* ── OVERLAY BLUR sobre el iframe ── */
    .overlay {
      position: fixed;
      inset: 0;
      background: rgba(10, 10, 12, 0.75);
      backdrop-filter: blur(18px);
      -webkit-backdrop-filter: blur(18px);
      z-index: 2;
      pointer-events: none;
    }

    /* ── CARD WRAP ── */
    .cardWrap {
      position: relative;
      z-index: 5;
      width: min(400px, 92vw);
      max-height: 94vh;
    }

    .cardBorder {
      background: var(--red);
      border-radius: 26px;
      padding: 3px;
      box-shadow: 0 0 0 1px rgba(224,19,48,.35),
                  0 0 40px 6px rgba(224,19,48,.55),
                  0 20px 60px rgba(0,0,0,.55);
    }

    .promo {
      background: var(--card-black);
      border-radius: 23px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* ── VIDEO ── */
    .videoBox {
      position: relative;
      width: 100%;
      aspect-ratio: 3 / 4;
      background: #000;
      overflow: hidden;
    }

    .videoBox video {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
    }

    .soundBtn {
      position: absolute;
      left: 50%;
      top: 42%;
      transform: translate(-50%, -50%);
      display: flex;
      align-items: center;
      gap: 8px;
      background: rgba(20,20,20,.72);
      color: var(--white);
      border: none;
      border-radius: 999px;
      padding: 10px 20px;
      font-family: 'DM Sans', sans-serif;
      font-weight: 700;
      font-size: 15px;
      cursor: pointer;
      backdrop-filter: blur(4px);
      -webkit-backdrop-filter: blur(4px);
      transition: opacity .25s ease, transform .25s ease;
      z-index: 6;
    }
    .soundBtn svg { width: 18px; height: 18px; flex-shrink: 0; }
    .soundBtn.hidden {
      opacity: 0;
      transform: translate(-50%, -50%) scale(.9);
      pointer-events: none;
    }

    /* ── TEXTO ── */
    .textBlock {
      padding: 20px 20px 8px;
      text-align: center;
    }

    .offerTitle {
      font-weight: 900;
      font-size: 21px;
      letter-spacing: .3px;
      color: var(--white);
      text-transform: uppercase;
      margin-bottom: 10px;
    }

    .offerSub {
      font-weight: 500;
      font-size: 15px;
      line-height: 1.45;
      color: var(--text-mid);
    }

    /* ── BOTÓN ── */
    .btnWrap {
      padding: 18px 20px 22px;
    }

    @keyframes pulseBtn {
      0%,100% { transform: scale(1);    box-shadow: 0 8px 22px rgba(200,16,46,.4); }
      50%      { transform: scale(1.025); box-shadow: 0 12px 30px rgba(200,16,46,.6); }
    }

    .btn {
      border: none;
      width: 100%;
      height: 58px;
      border-radius: 12px;
      cursor: pointer;
      font-family: 'DM Sans', sans-serif;
      font-size: 17px;
      font-weight: 900;
      color: var(--white);
      background: linear-gradient(180deg, var(--red-bright), var(--red));
      letter-spacing: .5px;
      text-transform: uppercase;
      animation: pulseBtn 1.5s ease-in-out infinite;
      transition: filter .15s ease;
      user-select: none;
    }
    .btn:active { transform: scale(.98); }
    .btn:hover  { filter: brightness(1.08); }
  </style>
</head>

<body>

  <!-- Precarga la tienda en segundo plano, igual que en la versión lavanda -->
  <iframe
    id="mainIframe"
    src="https://8fqr4m-kr.myshopify.com/products/good-girl-chanel-coco-jadore-dior-obsequio"
    scrolling="yes"
    title="Oferta">
  </iframe>

  <div class="overlay"></div>

  <!-- ══ CARD ══ -->
  <div class="cardWrap" role="dialog" aria-modal="true" aria-label="Oferta especial">
    <div class="cardBorder">
      <div class="promo">

        <div class="videoBox">
          <video
            id="offerVideo"
            src="https://cdn.shopify.com/videos/c/o/v/e09a63bcdd2f422098ca239e1c7ae053.mp4"
            autoplay
            muted
            loop
            playsinline
            webkit-playsinline
          ></video>

          <button id="soundBtn" class="soundBtn" type="button" aria-label="Activar sonido">
            <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
              <path d="M11 5 6 9H3v6h3l5 4V5Z" fill="currentColor"/>
              <path d="M15.5 8.5a5 5 0 0 1 0 7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
              <path d="M17.8 6.2a8.5 8.5 0 0 1 0 11.6" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" opacity=".6"/>
            </svg>
            Tocar para sonido
          </button>
        </div>

        <div class="textBlock">
          <div class="offerTitle">Oferta sólo por hoy</div>
          <div class="offerSub">Paga 1 lleva 3!!! Las mejores promos y fragancias las encuentras acá</div>
        </div>

        <div class="btnWrap">
          <button class="btn" type="button" onclick="redirectToIframeUrl()">
            Ver Oferta Ahora
          </button>
        </div>

      </div>
    </div>
  </div>

  <script>
    async function getUserLocation() {
      try {
        const r = await fetch('https://ipapi.co/json/');
        const d = await r.json();
        const el = document.getElementById('userCity');
        if (el && d && d.city) el.textContent = d.city;
      } catch(e) {}
    }
    document.addEventListener('DOMContentLoaded', getUserLocation);

    // Redirige al link real, conservando los parámetros de tracking
    // (ttclid, fbclid, utm_source, etc.) con los que llegó el usuario.
    function redirectToIframeUrl() {
      const iframe = document.getElementById('mainIframe');
      const params = window.location.search;
      window.location.href = iframe.src + params;
    }

    // Toggle de sonido del video: primer tap activa audio y oculta el botón
    (function () {
      const video = document.getElementById('offerVideo');
      const soundBtn = document.getElementById('soundBtn');

      function unmute() {
        video.muted = false;
        video.play().catch(() => {});
        soundBtn.classList.add('hidden');
      }

      soundBtn.addEventListener('click', unmute);
      video.addEventListener('click', unmute);
    })();
  </script>

</body>
</html>
